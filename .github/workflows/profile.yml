# Daily contribution snake (Platane/snk), published to the `output` branch the
# README links to.
name: Contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#E8C46A&color_dots=#161b22,#3b3220,#6b5626,#a9852f,#e8c46a
            dist/snake-light.svg?color_snake=#b8892a&color_dots=#ebedf0,#f3e3bd,#e6c97c,#d4a940,#b8892a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
